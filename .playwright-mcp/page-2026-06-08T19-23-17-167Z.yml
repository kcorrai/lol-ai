          - generic [ref=e20]:
            - heading "Information We Collect" [level=2] [ref=e21]
            - paragraph [ref=e22]: When you create an account, we collect your email address and a hashed password. We do not store plaintext passwords. If you connect a Riot Games account, we store the public identifiers associated with that account (game name, tag, PUUID, summoner ID) as provided by the Riot Games API.
            - paragraph [ref=e23]: We collect usage data (pages visited, features used) to improve the product. This data is not sold or shared with third parties for advertising purposes.
          - generic [ref=e24]:
            - heading "Riot Account Data" [level=2] [ref=e25]
            - paragraph [ref=e26]: LoL AI Coach uses the Riot Games API to retrieve your match history, ranked standing, and champion statistics. This data is fetched on your request and stored to power your coaching reports and dashboard. We only access data that is publicly available through the Riot Games API.
            - paragraph [ref=e27]: You can disconnect your Riot account at any time from Settings. Disconnecting removes the link between your LoL AI Coach account and your Riot account. Your historical match data may be retained for service continuity unless you request deletion.
          - generic [ref=e28]:
            - heading "Usage Analytics" [level=2] [ref=e29]
            - paragraph [ref=e30]: We may use privacy-respecting analytics tools (such as Vercel Analytics) to understand how users interact with the product. These tools do not use cookies and do not track you across other websites.
          - generic [ref=e31]:
            - heading "AI Generated Reports" [level=2] [ref=e32]
            - paragraph [ref=e33]: Coaching reports are generated by sending anonymized match statistics to a third-party AI provider (OpenAI or Anthropic). Your personal identifiers (name, email, Riot username) are never included in prompts sent to AI providers. Generated reports are stored in our database and associated with your account.
          - generic [ref=e34]:
            - heading "Data Retention" [level=2] [ref=e35]
            - paragraph [ref=e36]: We retain your account data for as long as your account is active. If you delete your account, your personal data is removed within 30 days. Match data sourced from the Riot API may be retained in anonymized form for aggregate analytics.
