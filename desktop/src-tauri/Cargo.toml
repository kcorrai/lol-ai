[package]
name = "lol-ai-desktop"
version = "0.1.0"
description = "LoL AI Coach desktop companion"
authors = ["LoL AI Coach"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lol_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `tray-icon` is what lets this app keep running with no window on screen. A companion
# nobody remembers to launch before a game is a companion that never runs at all, and
# every competitor starts with the client rather than by hand.
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Launch on start-up, offered in Settings and off until the player asks for it. Putting
# itself in the player's start-up list uninvited is what the reviews of the competitors
# complain about.
tauri-plugin-autostart = "2"

# A second copy would poll the same port and hold a second keychain handle. There is one
# game on this machine, so there is one of these.
tauri-plugin-single-instance = "2"

# One shortcut, registered in Rust and never exposed to the webview: the overlay has to be
# reachable while the game holds the keyboard, which is the whole definition of a global
# shortcut. Nothing is sent *to* the game — this listens, it does not type.
tauri-plugin-global-shortcut = "2"

# Hands a URL to the operating system's default browser. Used from Rust only — the plugin's
# own commands are not granted to the webview, so the address opened is always one this
# binary built from its compiled-in base rather than one the renderer chose.
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"

# rustls rather than the platform TLS stack, because this client must trust exactly one
# certificate authority — Riot's — and nothing else. `tls_built_in_root_certs(false)` is
# what makes that true, and it is far easier to reason about on rustls.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }


# keyring 3 onwards makes the platform backend an explicit choice rather than a default,
# so each target names its own.
[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1", features = ["zbus-secret-service-keyring-store"] }
